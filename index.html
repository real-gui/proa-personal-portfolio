
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home | gui</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <button
        class="theme-toggle"
        type="button"
        aria-label="Switch to light mode"
    >
        <i data-lucide="sun"></i>
    </button>

    <main class="home">
        <h1 aria-label="guilherme">
            <span aria-hidden="true">G</span>
            <span aria-hidden="true">U</span>
            <span aria-hidden="true">I</span>
            <span aria-hidden="true">L</span>
            <span aria-hidden="true">H</span>
            <span aria-hidden="true">E</span>
            <span aria-hidden="true">R</span>
            <span aria-hidden="true">M</span>
            <span aria-hidden="true">E</span>
        </h1>

        <nav>
            <a href="projects.html">projects</a>
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </nav>
    </main>

    <footer class="home-footer">
        <p>PROA Transforme-se // real-gui</p>
    </footer>

    <div class="language-switcher">
        <button
            class="language-button"
            type="button"
            data-lang="pt"
            aria-label="Switch to Portuguese"
        >
            PT
        </button>

        <span class="language-divider" aria-hidden="true">/</span>

        <button
            class="language-button"
            type="button"
            data-lang="en"
            aria-label="Switch to English"
        >
            EN
        </button>
    </div>

    <script
        src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"
    ></script>
    <script src="js/theme.js"></script>
    <script src="js/language.js"></script>
</body>
</html>
